name: Dependabot auto-merge

on:
  pull_request_target:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for PR tests
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            run_id=$(gh api --method GET "repos/$GH_REPO/actions/workflows/test.yml/runs" \
              -f event=pull_request -f head_sha="$PR_SHA" -f per_page=1 \
              --jq '.workflow_runs[0].id // empty')
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status --interval 10
              tested=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" \
                --jq '[.jobs[] | select(.name == "test") | .steps[] | select(.name == "Run tests" and .conclusion == "success")] | length')
              if [[ "$tested" -eq 0 ]]; then
                echo "The Run tests step did not succeed" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "No test workflow found for the PR head commit" >&2
          exit 1

      - name: Merge Dependabot PR
        if: |
          success() && (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.update-type == 'version-update:semver-patch'
          )
        run: gh pr merge --auto --merge --match-head-commit "$PR_SHA" "$PR_URL"
