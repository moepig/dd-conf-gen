version: 2

before:
  hooks:
    - go mod download
    - go test -short ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: dd-conf-gen
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_ {{- .Version }}_ {{- .Os }}_ {{- .Arch }}
    formats:
      - binary

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing
